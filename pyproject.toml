[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "football-telegram-bot"
version = "1.0.0"
description = "Polski bot Telegram do śledzenia typów piłkarskich"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[job-queue]>=21.10,<23",
  "httpx>=0.27,<1",
  "aiosqlite>=0.20,<1",
]

[tool.setuptools]
py-modules = [
  "main",
  "config",
  "database",
  "football_api",
  "settlement",
  "reports",
  "bot",
  "scheduler",
  "coupon",
  "betbuilder",
]
