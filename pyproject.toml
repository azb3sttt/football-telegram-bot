[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-telegram-bot"
version = "0.1.0"
description = "Polski bot Telegram do analizy meczów, kuponów i transparentnego trackingu wyników"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "football-telegram-bot"}]
dependencies = [
  "python-telegram-bot[job-queue]==22.8",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
